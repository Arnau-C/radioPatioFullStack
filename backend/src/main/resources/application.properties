spring.application.name=backend

# --- 1. DATOS DE CONEXIÓN A LA BASE DE DATOS ---
# La URL le dice: es MySQL, en mi máquina (localhost), puerto 3306, base de datos 'vecinos_db'
spring.datasource.url=jdbc:mysql://localhost:3306/RadioPatioDB?createDatabaseIfNotExist=true&serverTimezone=UTC

# Tu usuario de MySQL (por defecto suele ser root)
spring.datasource.username=root

# Tu contraseña de MySQL (si no tienes, déjalo vacío, pero cuidado en producción)
spring.datasource.password=Asdqwe123

# El nombre de la clase del driver (el traductor que añadimos en el pom.xml)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# --- 2. CONFIGURACIÓN DE JPA / HIBERNATE (EL ORM) ---

# CRÍTICO: Esto define qué hace Spring con las tablas al arrancar.
# 'update': Si la tabla no existe, la crea. Si existe y añadiste una columna en Java, actualiza la tabla. 
# ¡Es lo mejor para desarrollar!
spring.jpa.hibernate.ddl-auto=update

# Le decimos qué "dialecto" de SQL hablar (MySQL 8 en este caso) para que optimice las consultas.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# --- 3. HERRAMIENTAS PARA VER QUÉ PASA (DEBUG) ---

# Esto hará que Spring te muestre en la consola las consultas SQL que está ejecutando por debajo.
# Muy útil para aprender y ver si está haciendo lo que esperas.
spring.jpa.show-sql=true

# Esto hace que el SQL que muestra sea bonito y legible, no todo en una línea.
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# --- 4. SEGURIDAD TEMPORAL (PARA DESARROLLO) ---
# Esto fija el usuario/pass por defecto para que no cambie cada vez que reinicias
spring.security.user.name=admin
spring.security.user.password=admin123