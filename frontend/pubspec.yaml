name: frontend
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - lib/images/logo.png
    - assets/images/

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.0
  http_parser: ^4.0.0  
  flutter_secure_storage: ^10.0.0
  cupertino_icons: ^1.0.2
  device_info_plus: ^12.3.0
  provider: ^6.1.5+1
  intl: ^0.20.2
  file_picker: ^8.0.0
  syncfusion_flutter_pdfviewer: any  
  glassmorphism: ^3.0.0
  share_plus: any
  google_fonts: ^6.2.1
  go_router: ^14.8.1

flutter_launcher_icons:
  android: true
  ios: true
  windows: true
  macos: true
  image_path: "assets/logo.png"
